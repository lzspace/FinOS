[package]
name = "agent-os-finance-desktop"
version = "1.2.0"
description = "Local-only Tauri host for Agent OS Finance"
authors = ["Agent OS Finance"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "agent_os_finance_desktop"
crate-type = ["lib", "cdylib", "staticlib"]

[[bin]]
name = "agent-os-finance"
path = "src/main.rs"

[features]
default = []
e2e-fixtures = []

[build-dependencies]
tauri-build = { version = "2.5.6", features = [] }

[dependencies]
dirs = "6.0.0"
libc = "0.2.183"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
tauri = { version = "2.11.5", features = [] }
tauri-plugin-dialog = "2.6.0"
thiserror = "2.0.18"
tokio = { version = "1.53.1", features = ["sync"] }
uuid = { version = "1.22.0", features = ["v4", "serde"] }

[dev-dependencies]
tempfile = "3.27.0"
